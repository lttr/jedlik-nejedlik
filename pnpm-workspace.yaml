packages:
  - web

# pnpm 11 hard-errors on unreviewed dependency build scripts (strictDepBuilds),
# so every package that runs one must be listed explicitly.
allowBuilds:
  "@parcel/watcher": false
  "@sentry/cli": false
  esbuild: true
  fallow: true
  sharp: true
  unrs-resolver: true
  vue-demi: false

# Adopt vite-plus: alias `vite` to VoidZero's drop-in build. `vitest` is NOT
# aliased — see the note under `overrides` below.
# The `vite-plus` CLI row is an EXACT pin, not `latest` and not a range, because
# `web/package.json` pins `rolldown` to the version this release bundles
# (0.3.0 -> rolldown 1.2.5). rolldown ships a native binary and a skew against
# the CLI's own copy breaks `vp` outright, so a caret here would let
# `pnpm update` float the CLI away from the rolldown pin. Move the two together,
# or neither.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: 0.3.0

# Nuxt+pnpm need (since `nuxi init`); vp subprocesses also rely on it. Don't
# enable enableGlobalVirtualStore — breaks resolution the same way.
shamefullyHoist: true

# =============================================================================
# Workarounds for running pre-1.0 vite-plus under tooling that doesn't know
# about it. Each is tagged with its issue and DELETE-WHEN condition; expect to
# remove them one by one as the ecosystem matures.
# =============================================================================

overrides:
  # ISSUE: Nuxt/@nuxt/vite-builder pull their own upstream vite instead of the
  #   aliased build — @nuxt/vite-builder 4.5.2 declares `vite: ^8.2.0` as a
  #   direct DEPENDENCY, not a peer. `catalog:` forces ALL transitive deps onto
  #   ours.
  # DELETE WHEN: Nuxt ships vite-plus compat. NOTE: this does NOT drop the
  #   `rolldown` devDep in web/ — nuxt 4.5.2 peers `rolldown: ~1.2.1` and does
  #   not mark it optional, so it stays required with or without the alias.
  vite: "catalog:"

# NOTE: `vitest` is deliberately NOT aliased. The old
#   @voidzero-dev/vite-plus-test alias is dead upstream: the vite-plus CLI
#   dropped that package at 0.3.0 and depends on plain vitest directly, and its
#   README now says to install plain `vitest` pinned to the version `vp
#   toolchain` reports (so the project and `vp test` share one Vitest copy).
#   That is what `web/package.json` does — an EXACT pin that must move together
#   with the `vite-plus` row above (0.3.0 -> vitest 4.1.11).

# ISSUE: vite-plus-core's version string (0.3.0) satisfies no upstream `vite`
#   range, so every package peering on `vite` reports an unmet peer. Under
#   pnpm 11.2.2 these are WARNINGS,
#   not install errors — verified 2026-08-27 by removing the rules and
#   re-resolving: `pnpm install` still exits 0. The rules are noise
#   suppression, and they earn their keep by keeping a genuine peer problem
#   visible.
# DELETE WHEN: Nuxt ships vite-plus compat (same trigger as the override above).
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@lttr/nuxt-validated-runtime-config@0.1.2"
