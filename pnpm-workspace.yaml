packages:
  - web

# pnpm 11 hard-errors on unreviewed dependency build scripts (strictDepBuilds),
# so every package that runs one must be listed explicitly.
allowBuilds:
  "@parcel/watcher": false
  "@sentry/cli": false
  esbuild: true
  fallow: true
  sharp: true
  unrs-resolver: true
  vue-demi: false

# Adopt vite-plus: alias `vite` to VoidZero's drop-in build. `vitest` is not
# declared at all — see the note under `overrides` below.
#
# THREE ROWS MOVE AS ONE. Both rows here are EXACT pins — not `latest`, not a
# range — and so is `rolldown` in `web/package.json`. vite-plus 1.1.0 bundles
# core 1.1.0 and rolldown 1.2.12; those are the numbers the other two rows
# carry (`vp --version` lists them).
#
# Why exact: rolldown ships a native binary, and a skew between it and the copy
# the CLI bundles breaks `vp` outright. The core alias is the same hazard from
# the other side — vite-plus 0.3.0 dropped core's `./binding` subpath export, so
# a CLI and a core from different releases fail to resolve the native binding at
# all. That is not hypothetical: it broke `pnpm install` during the 0.2.5 -> 0.3.0
# upgrade (.aiwork/2026-08-26_nuxt-4.5-toolchain-upgrade/notes.md, ticket 02).
#
# So `latest` or a caret on either row would let `pnpm update` float one member
# of the set while the pinned two stayed put. Bump all three together, or none;
# `vp migrate` after the bump applies the release's config changes.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

# Nuxt+pnpm need (since `nuxi init`); vp subprocesses also rely on it. Don't
# enable enableGlobalVirtualStore — breaks resolution the same way.
shamefullyHoist: true

# =============================================================================
# Workarounds for running vite-plus under tooling that doesn't know
# about it. Each is tagged with its issue and DELETE-WHEN condition; expect to
# remove them one by one as the ecosystem matures.
# =============================================================================

overrides:
  # ISSUE: Nuxt/@nuxt/vite-builder pull their own upstream vite instead of the
  #   aliased build — @nuxt/vite-builder 4.5.2 declares `vite: ^8.2.0` as a
  #   direct DEPENDENCY, not a peer. `catalog:` forces ALL transitive deps onto
  #   ours.
  # DELETE WHEN: Nuxt ships vite-plus compat. NOTE: this does NOT drop the
  #   `rolldown` devDep in web/ — nuxt 4.5.2 peers `rolldown: ~1.2.1` and does
  #   not mark it optional, so it stays required with or without the alias.
  vite@*: "catalog:"

# NOTE: `vitest` is neither aliased nor declared. vite-plus 1.x depends on an
#   exact vitest (5.0.3 at 1.1.0) and re-exports it as `vite-plus/test`, which
#   is what our tests and vitest configs import, so a single `vite-plus` install
#   is the whole test runner. A direct `vitest` pin would only be a second copy
#   to keep in step.

# ISSUE: vite-plus-core's version string (1.1.0) satisfies no upstream `vite`
#   range, so every package peering on `vite` reports an unmet peer. Under
#   pnpm 11.2.2 these are WARNINGS,
#   not install errors — verified 2026-08-27 by removing the rules and
#   re-resolving: `pnpm install` still exits 0. The rules are noise
#   suppression, and they earn their keep by keeping a genuine peer problem
#   visible.
# DELETE WHEN: Nuxt ships vite-plus compat (same trigger as the override above).
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# ISSUE: `web/` declares `h3` even though nothing in our code has it as a real
#   dependency — Nuxt owns it. `@eslint/config-inspector` drags in the
#   pre-release h3 2.0.1-rc.29, `shamefullyHoist` lifts THAT copy to the root,
#   and Nuxt's generated tsconfig `paths` then map bare `h3` at it. Server code
#   doing `import type { H3Event } from "h3"` gets v2's event while
#   `defineEventHandler` (nitro 2.13.4, h3 ^1.15.11) hands over v1's — 27
#   typecheck errors, all in `web/layers/*/server`. Declaring h3 in `web/` puts
#   v1 in `web/node_modules` and the paths follow it.
# DELETE WHEN: no second h3 major is installed (`pnpm why h3` finds one
#   version), or Nuxt moves to nitro 3 / h3 v2 and this becomes the wrong pin
#   rather than an unneeded one.
# The pin is EXACT and tracks whatever `nitropack` resolves — it exists to be
# the same copy Nuxt uses, so a range that could drift off it defeats it.
